name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: uv run --python 3.12 --with ruff ruff check .

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --with pytest python -m pytest -q

      - name: Smoke test
        run: uv run --python ${{ matrix.python-version }} python llmctx.py . smoke.md --no-git
        shell: bash

      - name: Check smoke output is non-empty
        run: test -s smoke.md
        shell: bash
